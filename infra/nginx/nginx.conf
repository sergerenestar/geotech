# GeoTech Lab — Nginx gateway configuration
#
# Role: layer-4 reverse proxy and CORS / security-header enforcement.
# JWT validation is NOT done here — each Spring Boot service validates tokens independently.
#
# Request routing overview:
#   /api/auth/login, /api/auth/refresh  → Next.js web app (sets/reads the httpOnly cookie)
#   /api/auth/*                         → auth-service
#   /api/projects, /api/boreholes,
#   /api/samples, /api/clients,
#   /api/locations                      → project-service
#   /api/tests/water-content            → test-wc-service
#   /api/tests/<type>                   → test-<type>-service (one per ASTM test type)
#   /api/tests/active, /completed,
#   /api/tests/<id>/(submit|approve|…)  → project-service (workflow controller)
#   /internal/*                         → internal service-to-service endpoints
#   /api/ai, /api/reports, …            → 503 until services are deployed
#   /                                   → Next.js web app (catch-all)
#
# IMPORTANT: After any upstream container is restarted, reload Nginx to flush
# cached DNS:  docker exec geotech-gateway nginx -s reload

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting — auth endpoints only (60 requests/minute per client IP)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

    # Docker internal DNS — re-resolve upstreams after container recreates
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Active upstreams (Sprint 1–5)
    upstream auth_service         { server auth-service:8080; }
    upstream project_service      { server project-service:8081; }
    upstream test_wc_service      { server test-wc-service:8083; }
    upstream test_ll_service      { server test-ll-service:8084; }
    upstream test_proctor_service { server test-proctor-service:8085; }
    upstream test_sg_service      { server test-sg-service:8086; }
    upstream test_ps_service      { server test-ps-service:8087; }
    upstream test_perm_service    { server test-perm-service:8088; }
    upstream test_uc_service      { server test-uc-service:8089; }
    upstream test_ds_service      { server test-ds-service:8091; }
    upstream test_cbr_service     { server test-cbr-service:8092; }
    upstream test_consol_service  { server test-consol-service:8093; }
    upstream web_app              { server web:3000; }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health probe
        location /health {
            access_log off;
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        # Login / refresh → Next.js route handlers (they set the httpOnly cookie)
        location = /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/auth/refresh {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other auth endpoints → auth-service directly
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Project service
        location /api/projects {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/boreholes {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/samples {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/clients {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/locations {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Water content test service
        location /api/tests/water-content {
            proxy_pass http://test_wc_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/water-content {
            proxy_pass http://test_wc_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Liquid limit test service (Sprint 3)
        location /api/tests/liquid-limit {
            proxy_pass http://test_ll_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/liquid-limit {
            proxy_pass http://test_ll_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Particle size test service (Sprint 3)
        location /api/tests/particle-size {
            proxy_pass http://test_ps_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/particle-size {
            proxy_pass http://test_ps_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proctor service (Sprint 4)
        location /api/tests/proctor {
            proxy_pass http://test_proctor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/proctor {
            proxy_pass http://test_proctor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Specific gravity service (Sprint 4)
        location /api/tests/specific-gravity {
            proxy_pass http://test_sg_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/specific-gravity {
            proxy_pass http://test_sg_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Unconfined compression service (Sprint 4)
        location /api/tests/unconfined-compression {
            proxy_pass http://test_uc_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/unconfined-compression {
            proxy_pass http://test_uc_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Direct shear service (Sprint 4)
        location /api/tests/direct-shear {
            proxy_pass http://test_ds_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/direct-shear {
            proxy_pass http://test_ds_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/tests/cbr {
            proxy_pass http://test_cbr_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/cbr {
            proxy_pass http://test_cbr_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Permeability service (Sprint 5)
        location /api/tests/permeability {
            proxy_pass http://test_perm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/permeability {
            proxy_pass http://test_perm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Consolidation service (Sprint 5)
        location /api/tests/consolidation {
            proxy_pass http://test_consol_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/consolidation {
            proxy_pass http://test_consol_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Workflow endpoints — handled by project-service
        location = /api/tests/active {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/tests/completed {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~* ^/api/tests/[^/]+/(submit|manager-approve|manager-reject|pm-approve|pm-reject|comments)$ {
            proxy_pass http://project_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Unimplemented services — return 503 until deployed
        location /api/tests/ {
            return 503 '{"error":"Service not yet deployed"}';
            add_header Content-Type application/json;
        }

        location /api/ai {
            return 503 '{"error":"Service not yet deployed"}';
            add_header Content-Type application/json;
        }

        location /api/reports {
            return 503 '{"error":"Service not yet deployed"}';
            add_header Content-Type application/json;
        }

        location /api/media {
            return 503 '{"error":"Service not yet deployed"}';
            add_header Content-Type application/json;
        }

        location /api/notifications {
            return 503 '{"error":"Service not yet deployed"}';
            add_header Content-Type application/json;
        }

        # Web app — catch-all
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
