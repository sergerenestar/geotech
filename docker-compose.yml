name: geotech-lab

services:

  postgres:
    image: postgres:16-alpine
    container_name: geotech-db
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geotech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-geotechdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geotech} -d ${POSTGRES_DB:-geotechdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [geotech-net]

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: geotech-gateway
    ports:
      - "8888:80"
    depends_on:
      - auth-service
      - project-service
      - web
    networks: [geotech-net]

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: geotech-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geotechdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-geotech}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [geotech-net]

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile
    container_name: geotech-project
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geotechdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-geotech}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [geotech-net]

  test-wc-service:
