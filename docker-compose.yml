  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    container_name: geotech-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      BACKEND_URL: http://auth-service:8080
      NODE_ENV: production
      COOKIE_SECURE: "false"
    depends_on:
      - auth-service
    networks: [geotech-net]

volumes:
  postgres_data:

networks:
  geotech-net:
    driver: bridge
