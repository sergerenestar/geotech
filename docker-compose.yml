      JWT_SECRET: ${JWT_SECRET:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [geotech-net]

  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    container_name: geotech-media
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geotechdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-geotech}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-geotech-media-dev}
      AWS_REGION: ${AWS_REGION:-ca-central-1}
