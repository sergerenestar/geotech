spring.datasource.url=jdbc:postgresql://localhost:15434/geotechdb_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=test_ll
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.schemas=test_ll
spring.flyway.baseline-on-migrate=true

jwt.secret=test-secret-minimum-256-bits-for-hmac-sha256-algorithm-key-here
